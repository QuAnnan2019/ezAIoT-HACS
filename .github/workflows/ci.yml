name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: python -m pip install --requirement requirements_test.txt
      - name: Run tests
        run: python -m pytest tests -q

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: python -m pip install --requirement requirements_test.txt
      - name: Lint Python
        run: python -m ruff check custom_components tests
      - name: Validate JSON
        run: |
          python -m json.tool hacs.json > /dev/null
          python -m json.tool custom_components/ezaiot/manifest.json > /dev/null
          python -m json.tool custom_components/ezaiot/strings.json > /dev/null
          python -m json.tool custom_components/ezaiot/translations/zh-Hans.json > /dev/null
      - name: Validate panel JavaScript
        run: node --check custom_components/ezaiot/frontend/ezaiot-panel.js
      - name: Check whitespace
        run: git diff --check "$(git merge-base origin/main HEAD)" HEAD
